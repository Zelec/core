name: Nix Flake Package Validation
on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Only run if nix files, the lockfile, or secrets change
    paths:
      - "**.nix"
      - "flake.lock"
      - "**.yml"
      - "**.yaml"
  pull_request:
    branches:
      - main
    # Only run if nix files, the lockfile, or secrets change
    paths:
      - "**.nix"
      - "flake.lock"
      - "**.yml"
      - "**.yaml"
jobs:
  validate:
    name: Validate Package - ${{ matrix.package }} - (${{ matrix.system }})
    runs-on: nix-container-builder-${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
        package:
          - caddy-docker-proxy
          - zot
          - zot-docker-proxy
    steps:
      - name: Checkout Code
        uses: https://code.forgejo.org/actions/checkout@v7
      - name: Run Prereqs
        uses: ./.forgejo/workflows-composite/setup-nix
        with:
          github_token: ${{ secrets.PAT_GITHUB }}
      - name: Build Package - ${{ matrix.package }}
        run: nix build ./#packages.${{ matrix.system }}.${{ matrix.package }}
